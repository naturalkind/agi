<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Code Analyzer</title>
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --success: #4cc9f0;
            --danger: #f72585;
            --warning: #f8961e;
            --light: #f8f9fa;
            --dark: #212529;
            --gray: #6c757d;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        header {
            background: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .tabs {
            display: flex;
            background: var(--secondary);
        }
        
        .tab {
            padding: 15px 30px;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
            border: none;
            background: none;
            font-size: 16px;
        }
        
        .tab:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .tab.active {
            background: var(--primary);
            border-bottom: 3px solid var(--success);
        }
        
        .tab-content {
            display: none;
            padding: 20px;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 600px;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 20px;
            background: #f8f9fa;
        }
        
        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 10px;
            max-width: 80%;
        }
        
        .user-message {
            background: var(--primary);
            color: white;
            margin-left: auto;
        }
        
        .bot-message {
            background: #e9ecef;
            color: var(--dark);
        }
        
        .input-group {
            display: flex;
            gap: 10px;
        }
        
        input, textarea, select {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        button {
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: var(--secondary);
        }
        
        button:disabled {
            background: var(--gray);
            cursor: not-allowed;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }
        
        .status {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .file-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            margin: 10px 0;
        }
        
        .file-item {
            padding: 5px;
            border-bottom: 1px solid #eee;
        }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 10px 0;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 RAG Code Analyzer</h1>
            <p>Анализ кода с использованием RAG и больших языковых моделей</p>
        </header>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('chat')">💬 Чат с моделью</button>
            <button class="tab" onclick="switchTab('index')">📂 Управление индексом</button>
        </div>
        
        <!-- Чат вкладка -->
        <div id="chat" class="tab-content active">
            <div class="chat-container">
                <div id="chatMessages" class="chat-messages">
                    <div class="message bot-message">
                        Добро пожаловать! Я помогу вам проанализировать ваш код. Загрузите файлы и задавайте вопросы.
                    </div>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="useRag" checked>
                    <label for="useRag">Использовать RAG (контекст из кода)</label>
                </div>
                
                <div class="input-group">
                    <input type="text" id="messageInput" placeholder="Задайте вопрос о коде..." onkeypress="handleKeyPress(event)">
                    <button onclick="sendMessage()">Отправить</button>
                </div>
            </div>
        </div>
        
        <!-- Управление индексом вкладка -->
        <div id="index" class="tab-content">
            <div class="controls">
                <div>
                    <h3>Индексация директории</h3>
                    <input type="text" id="directoryPath" placeholder="Путь к директории с кодом">
                    <input type="text" id="excludeDirs" placeholder="Исключить папки (через запятую)" value="venv,.git,__pycache__,migrations">
                    <input type="text" id="excludeFiles" placeholder="Исключить файлы (через запятую)" value="config.py,secret_keys.py">
                    <button onclick="buildIndex()">Построить индекс</button>
                </div>
                
                <div>
                    <h3>Управление индексом</h3>
                    <input type="text" id="savePath" placeholder="Путь для сохранения" value="./saved_index">
                    <button onclick="saveIndex()">💾 Сохранить</button>
                    <input type="text" id="loadPath" placeholder="Путь для загрузки" value="./saved_index">
                    <button onclick="loadIndex()">📂 Загрузить</button>
                    <button onclick="clearIndex()">🧹 Очистить индекс</button>
                </div>
            </div>
            
            <div id="indexStatus" class="status"></div>
            
            <h3>Проиндексированные файлы</h3>
            <div id="fileList" class="file-list"></div>
            <button onclick="updateFileList()">🔄 Обновить список файлов</button>
            <button onclick="removeSelectedFiles()">Удалить выбранные</button>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';
        let currentBotMessage = null;
        
        // Переключение вкладок
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }
        
        // Отправка сообщения
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            const useRag = document.getElementById('useRag').checked;
            
            if (!message) return;
            
            addMessage(message, 'user');
            input.value = '';
            input.disabled = true;
            
            currentBotMessage = addMessage('', 'bot');
            
            try {
                const response = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        use_rag: useRag
                    })
                });
                
                if (!response.ok) {
                    throw new Error('Ошибка сервера');
                }
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') break;
                            
                            try {
                                const parsed = JSON.parse(data);
                                if (parsed.token) {
                                    currentBotMessage.innerHTML += parsed.token;
                                    currentBotMessage.scrollIntoView({ behavior: 'smooth' });
                                }
                                if (parsed.error) {
                                    currentBotMessage.innerHTML += `<span style="color: red;">Ошибка: ${parsed.error}</span>`;
                                }
                            } catch (e) {
                                console.error('Error parsing JSON:', e);
                            }
                        }
                    }
                }
            } catch (error) {
                currentBotMessage.innerHTML += `<span style="color: red;">Ошибка: ${error.message}</span>`;
            } finally {
                input.disabled = false;
                input.focus();
            }
        }
        
        // Обработка нажатия Enter
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        // Добавление сообщения в чат
        function addMessage(text, type) {
            const messagesContainer = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message`;
            messageDiv.innerHTML = text;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            return messageDiv;
        }
        
        // Построение индекса
        async function buildIndex() {
            const directory = document.getElementById('directoryPath').value;
            const excludeDirs = document.getElementById('excludeDirs').value;
            const excludeFiles = document.getElementById('excludeFiles').value;
            
            if (!directory) {
                showStatus('Укажите путь к директории!', 'error');
                return;
            }
            
            showStatus('Индексация...', '');
            
            try {
                const response = await fetch(`${API_BASE}/index/build`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        directory: directory,
                        exclude_dirs: excludeDirs,
                        exclude_files: excludeFiles
                    })
                });
                
                const result = await response.json();
                showStatus(result.message, result.success ? 'success' : 'error');
                if (result.success) {
                    updateFileList();
                }
            } catch (error) {
                showStatus(`Ошибка: ${error.message}`, 'error');
            }
        }
        
        // Сохранение индекса
        async function saveIndex() {
            const path = document.getElementById('savePath').value;
            
            try {
                const response = await fetch(`${API_BASE}/index/save`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ path: path })
                });
                
                const result = await response.json();
                showStatus(result.message, result.success ? 'success' : 'error');
            } catch (error) {
                showStatus(`Ошибка: ${error.message}`, 'error');
            }
        }
        
        // Загрузка индекса
        async function loadIndex() {
            const path = document.getElementById('loadPath').value;
            
            try {
                const response = await fetch(`${API_BASE}/index/load`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ path: path })
                });
                
                const result = await response.json();
                showStatus(result.message, result.success ? 'success' : 'error');
                if (result.success) {
                    updateFileList();
                }
            } catch (error) {
                showStatus(`Ошибка: ${error.message}`, 'error');
            }
        }
        
        // Очистка индекса
        async function clearIndex() {
            if (!confirm('Вы уверены, что хотите очистить индекс?')) return;
            
            try {
                const response = await fetch(`${API_BASE}/index/clear`, {
                    method: 'POST'
                });
                
                const result = await response.json();
                showStatus(result.message, result.success ? 'success' : 'error');
                if (result.success) {
                    updateFileList();
                }
            } catch (error) {
                showStatus(`Ошибка: ${error.message}`, 'error');
            }
        }
        
        // Обновление списка файлов
        async function updateFileList() {
            try {
                const response = await fetch(`${API_BASE}/index/files`);
                const result = await response.json();
                
                const fileList = document.getElementById('fileList');
                fileList.innerHTML = '';
                
                if (result.files && result.files.length > 0) {
                    result.files.forEach(file => {
                        const fileItem = document.createElement('div');
                        fileItem.className = 'file-item';
                        fileItem.innerHTML = `
                            <input type="checkbox" value="${file}">
                            ${file}
                        `;
                        fileList.appendChild(fileItem);
                    });
                } else {
                    fileList.innerHTML = '<div class="file-item">Нет проиндексированных файлов</div>';
                }
            } catch (error) {
                showStatus(`Ошибка: ${error.message}`, 'error');
            }
        }
        
        // Удаление выбранных файлов
        async function removeSelectedFiles() {
            const selectedFiles = Array.from(document.querySelectorAll('#fileList input:checked'))
                .map(checkbox => checkbox.value);
            
            if (selectedFiles.length === 0) {
                showStatus('Выберите файлы для удаления', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/index/remove`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ file_paths: selectedFiles })
                });
                
                const result = await response.json();
                showStatus(result.message, result.success ? 'success' : 'error');
                if (result.success) {
                    updateFileList();
                }
            } catch (error) {
                showStatus(`Ошибка: ${error.message}`, 'error');
            }
        }
        
        // Показать статус
        function showStatus(message, type) {
            const status = document.getElementById('indexStatus');
            status.textContent = message;
            status.className = `status ${type}`;
        }
        
        // Инициализация при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            updateFileList();
            document.getElementById('messageInput').focus();
        });
    </script>
</body>
</html>
